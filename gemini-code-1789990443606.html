    const SCAN_QUEUE = [

    const SUGGESTED_QUESTIONS = [
      "¿Cómo van las ventas hoy comparadas con la semana pasada?",
      "¿Qué productos tengo que encargar antes de que se me acaben?",

    // Registro acumulado de la semana pasada rondando los 800.000 CLP
    const LAST_WEEK_SAME_DAY_TOTAL = 824500;

    const FIADOS_CUADERNO = [

    function formatCLP(n) {
      return `$${Math.round(n || 0).toLocaleString("es-CL")}`;
    }

    function greetingForNow() {
      const h = new Date().getHours();
      if (h < 12) return "Buenos días";
      if (h < 19) return "Buenas tardes";
      return "Buenas noches";
    }

    // Rostro oficial vectorizado fiel al diseño de marca de Alma

            transform: isThinking ? "scale(1.02) rotate(-1deg)" : isListening ? "scale(1.03)" : "scale(1)",

        >
          {/* Borde exterior blanco de sticker */}
          <path
            d="M 148 18

          {/* Sonrisa acogedora */}

    function App() {
      const [screen, setScreen] = useState("home");
      const [inventory, setInventory] = useState(INITIAL_INVENTORY);
      const [cart, setCart] = useState([]);
      const [salesLog, setSalesLog] = useState([
        {
          id: 101,
          time: new Date(Date.now() - 3600000 * 4.5),
          items: [
            { id: "p2", name: "Pan Hallulla (kg)", qty: 2, price: 1900 },
            { id: "p4", name: "Leche Entera Colun 1L", qty: 1, price: 1250 },
            { id: "p23", name: "Super 8 Clásico", qty: 2, price: 400 },
          ],
          total: 5850,
          paymentMethod: "Efectivo",
        },
        {
          id: 102,
          time: new Date(Date.now() - 3600000 * 3),
          items: [
            { id: "p1", name: "Coca-Cola 350ml", qty: 2, price: 950 },
            { id: "p7", name: "Papas Lays Clásicas 150g", qty: 1, price: 1600 },
          ],
          total: 3500,
          paymentMethod: "Débito / POS",
        },
        {
          id: 103,
          time: new Date(Date.now() - 3600000 * 1.5),
          items: [
            { id: "p5", name: "Huevos de Campo x12", qty: 1, price: 3800 },
            { id: "p6", name: "Aceite Maravilla 900ml", qty: 1, price: 2590 },
          ],
          total: 6390,
          paymentMethod: "Efectivo",
        },
        {
          id: 104,
          time: new Date(Date.now() - 3600000 * 0.4),
          items: [
            { id: "p21", name: "Queso Gouda Laminado 250g", qty: 1, price: 2600 },
            { id: "p3", name: "Pan Marraqueta (kg)", qty: 1.5, price: 1950 },
            { id: "p18", name: "Té Club x20 bolsitas", qty: 1, price: 990 },
          ],
          total: 5540,
          paymentMethod: "Débito / POS",
        },
      ]);

      const [scanState, setScanState] = useState("idle");
      const [scanQueueIndex, setScanQueueIndex] = useState(0);
      const [activePushNotification, setActivePushNotification] = useState(null);
      const [dismissedNotifications, setDismissedNotifications] = useState(new Set());
      const [toast, setToast] = useState(null);
      const [showCloseDayModal, setShowCloseDayModal] = useState(false);
      const [selectedCategory, setSelectedCategory] = useState("Todos");
      const [searchQuery, setSearchQuery] = useState("");
      const [voiceEnabled, setVoiceEnabled] = useState(true);

      const [messages, setMessages] = useState([
        {
          id: "greet",
          role: "alma",
          text: `${greetingForNow()}, casero. Ya cuadré los números: la semana pasada estuvimos cerca de los $824.000 y hoy el ritmo viene excelente. Lo único urgente es el Pan Hallulla, que le van quedando 3 kilos. ¿En qué te ayudo?`,
        },
      ]);
      const [inputText, setInputText] = useState("");
      const [isListening, setIsListening] = useState(false);
      const [isThinking, setIsThinking] = useState(false);

      const recognitionRef = useRef(null);
      const inputRef = useRef(null);
      const messagesEndRef = useRef(null);
      const toastTimerRef = useRef(null);

      // Reproducción de voz natural en español de Chile
      const speakAlmaVoice = useCallback((text) => {
        if (!voiceEnabled || !window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "es-CL";
        utterance.rate = 1.05;
        utterance.pitch = 1.0;
        window.speechSynthesis.speak(utterance);
      }, [voiceEnabled]);

      // Notificación Push controlada: solo 1 producto, sin bombardeo
      useEffect(() => {
        const lowStockItems = inventory.filter(
          (p) => p.stock <= 4 && !dismissedNotifications.has(p.id)
        );
        if (lowStockItems.length > 0 && !activePushNotification) {
          const target = lowStockItems[0];
          const timer = setTimeout(() => {
            setActivePushNotification({
              id: target.id,
              title: `¡Atención con ${target.name}!`,
              message: `Te van quedando solo ${target.stock} unidades en mostrador. ¿Quieres encargar 20 unidades ahora para no quedarte sin stock en la once?`,
              qtyToOrder: 20,
            });
          }, 2400);
          return () => clearTimeout(timer);
        }
      }, [inventory, activePushNotification, dismissedNotifications]);

      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [messages, isThinking]);

      const showToast = useCallback((text, ms = 2800) => {
        setToast(text);
        if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
        toastTimerRef.current = setTimeout(() => setToast(null), ms);
      }, []);

      function handleReorder(productId, qty) {
        setInventory((prev) =>
          prev.map((item) => (item.id === productId ? { ...item, stock: item.stock + qty } : item))
        );
        setDismissedNotifications((prev) => new Set(prev).add(productId));
        const prod = inventory.find((p) => p.id === productId);
        showToast(`Pedido registrado: +${qty} u. de ${prod?.name || "producto"}.`);
        setActivePushNotification(null);
      }

      function handleDismissNotification(productId) {
        setDismissedNotifications((prev) => new Set(prev).add(productId));
        setActivePushNotification(null);
      }

      function handlePriceAdjust(productId, newPrice, reason) {
        setInventory((prev) =>
          prev.map((item) => (item.id === productId ? { ...item, price: newPrice } : item))
        );
        showToast(`Precio ajustado a ${formatCLP(newPrice)}. Margen protegido.`);
      }

      function availableStock(productId, cartOverride) {
        const c = cartOverride || cart;
        const prod = inventory.find((p) => p.id === productId);
        const inCart = c.find((x) => x.id === productId);
        return (prod ? prod.stock : 0) - (inCart ? inCart.qty : 0);
      }

      // Métricas en tiempo real
      const totalHoy = useMemo(() => salesLog.reduce((s, v) => s + v.total, 0), [salesLog]);
      const orderCount = salesLog.length;
      const ticketPromedio = orderCount > 0 ? totalHoy / orderCount : 0;

      const costoEstimadoHoy = useMemo(() => {
        return salesLog.reduce((acc, sale) => {
          const saleCost = sale.items.reduce((sAcc, it) => {
            const prod = inventory.find((p) => p.id === it.id);
            return sAcc + (prod ? prod.cost * it.qty : it.price * 0.7 * it.qty);
          }, 0);
          return acc + saleCost;
        }, 0);
      }, [salesLog, inventory]);

      const gananciaLimpiaHoy = totalHoy - costoEstimadoHoy;
      const margenPorcentaje = totalHoy > 0 ? (gananciaLimpiaHoy / totalHoy) * 100 : 33.5;

      const currentHour = new Date().getHours() + new Date().getMinutes() / 60;
      const hoursPassed = Math.max(2, Math.min(12, currentHour - 8.5));
      const proyeccionCierre = (totalHoy / hoursPassed) * 12.5;

      const lowStockProducts = useMemo(() => inventory.filter((p) => p.stock <= 4), [inventory]);
      const totalFiados = useMemo(() => FIADOS_CUADERNO.reduce((s, f) => s + f.deuda, 0), []);

      const priceRecommendations = useMemo(() => {
        return [
          {
            id: "p2",
            name: "Pan Hallulla (kg)",
            currentPrice: 1900,
            suggestedPrice: 2050,
            type: "subir",
            badge: "Alta demanda",
            reason: "La harina subió 6% y vendes casi toda la hornada antes de las 13:00 hrs.",
            extraProfit: "+$150 por kg",
          },
          {
            id: "p6",
            name: "Aceite Maravilla 900ml",
            currentPrice: 2590,
            suggestedPrice: 2790,
            type: "subir",
            badge: "Alza mayorista",
            reason: "Llegó factura con costo en $1.950. Si mantienes precio ganas menos del 24%.",
            extraProfit: "+$200 margen",
          },
          {
            id: "p20",
            name: "Yogurt Batido 1L",
            currentPrice: 1750,
            suggestedPrice: 1550,
            type: "bajar",
            badge: "Rotación lenta",
            reason: "Lleva 3 días con baja salida. Bajarlo $200 previene vencimiento y libera caja.",
            extraProfit: "Evita merma",
          },
        ];
      }, []);

      function localAnswer(text) {
        const t = text.toLowerCase();
        if (t.includes("semana") || t.includes("pasad") || t.includes("compar")) {
          return `La semana pasada completa registramos ${formatCLP(LAST_WEEK_SAME_DAY_TOTAL)} en ventas, promediando unos ${formatCLP(LAST_WEEK_SAME_DAY_TOTAL / 7)} diarios. Hoy llevas ${formatCLP(totalHoy)} en ${orderCount} ventas, así que vamos con excelente ritmo.`;
        }
        if (t.includes("encarg") || t.includes("falta") || t.includes("acab") || t.includes("stock")) {
          return lowStockProducts.length
            ? `Casero, lo único crítico ahora es el ${lowStockProducts.map((p) => `${p.name} (${p.stock} u)`).join(", ")}. El resto del inventario está completamente abastecido.`
            : "Estamos impecables de stock en todas las categorías, no hace falta pedir nada por ahora.";
        }
        if (t.includes("precio") || t.includes("subir") || t.includes("margen") || t.includes("ajust")) {
          return `Te sugiero retocar el Aceite Maravilla a $2.790 porque subió el costo en la última factura de distribuidora, y subir el pan a $2.050/kg para resguardar tu margen.`;
        }
        if (t.includes("fiad") || t.includes("debe") || t.includes("cuaderno")) {
          return `En el cuaderno tienes ${formatCLP(totalFiados)} anotados entre 4 vecinos. El monto más alto es de Don Carlos con ${formatCLP(14500)}. Te conviene recordarle cuando pase en la tarde.`;
        }
        if (t.includes("guardar") || t.includes("arriendo") || t.includes("cuent") || t.includes("proveed")) {
          const reserva = totalHoy * 0.35;
          return `De lo cobrado hoy (${formatCLP(totalHoy)}), guarda ${formatCLP(reserva)} en el sobre de cuentas. Así pagas sin apuros los pedidos de abarrotes del jueves y el arriendo.`;
        }
        if (t.includes("hora") || t.includes("gente") || t.includes("peak") || t.includes("movim")) {
          return `Tus dos horarios más movidos son entre 12:30 y 14:00 (por bebidas y cecinas) y entre 18:30 y 20:45 cuando los vecinos vienen por el pan fresco.`;
        }
        if (t.includes("gan") || t.includes("limpi") || t.includes("bolsillo")) {
          return `De los ${formatCLP(totalHoy)} que entraron a la caja, descontando el costo al por mayor de los productos, te quedan unos ${formatCLP(gananciaLimpiaHoy)} limpios en el bolsillo (${margenPorcentaje.toFixed(1)}% de margen).`;
        }
        if (t.includes("ticket") || t.includes("promedio") || t.includes("proyecc")) {
          return `El ticket promedio está saliendo en ${formatCLP(ticketPromedio)} por compra. Al ritmo actual proyectamos cerrar el día sobre los ${formatCLP(proyeccionCierre)}.`;
        }

        return `Llevamos ${formatCLP(totalHoy)} en ${orderCount} ventas hoy. Pregúntame sobre stock, precios a retocar, fiados pendientes o la ganancia limpia del turno.`;
      }

      function handleUserSubmit(rawText) {
        const text = rawText.trim();
        if (!text) return;
        setInputText("");
        setMessages((prev) => [...prev, { id: Date.now(), role: "user", text }]);
        setIsThinking(true);
        setTimeout(() => {
          const answer = localAnswer(text);
          setMessages((prev) => [...prev, { id: Date.now() + 1, role: "alma", text: answer }]);
          setIsThinking(false);
          speakAlmaVoice(answer);
        }, 500);
      }

      function toggleListen() {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) {
          inputRef.current?.focus();
          return;
        }
        if (isListening) {
          recognitionRef.current?.stop();
          setIsListening(false);
          return;
        }
        try {
          const rec = new SR();
          rec.lang = "es-CL";
          rec.interimResults = false;
          rec.maxAlternatives = 1;
          rec.onstart = () => setIsListening(true);
          rec.onresult = (e) => {
            const transcript = e.results[0][0].transcript;
            setIsListening(false);
            handleUserSubmit(transcript);
          };
          rec.onerror = () => setIsListening(false);
          rec.onend = () => setIsListening(false);
          recognitionRef.current = rec;
          rec.start();
        } catch {
          setIsListening(false);
          inputRef.current?.focus();
        }
      }

      function handleScan() {
        if (scanState !== "idle") return;
        setScanState("scanning");
        setTimeout(() => {
          let found = null;
          let foundQueueIdx = null;
          for (let i = 0; i < SCAN_QUEUE.length; i++) {
            const tryIdx = (scanQueueIndex + i) % SCAN_QUEUE.length;
            const pid = SCAN_QUEUE[tryIdx];
            if (availableStock(pid) > 0) {
              found = pid;
              foundQueueIdx = tryIdx + 1;
              break;
            }
          }
          if (!found) {
            setScanState("empty");
            showToast("No queda stock disponible para escanear más.");
            setTimeout(() => setScanState("idle"), 1300);
            return;
          }
          setScanQueueIndex(foundQueueIdx);
          const prod = inventory.find((p) => p.id === found);
          const inCartQty = cart.find((c) => c.id === found)?.qty || 0;
          const avail = prod.stock - inCartQty - 1;
          const cartTotalAfter = cart.reduce((s, c) => s + c.price * c.qty, 0) + prod.price;

          setCart((prev) => {
            const existing = prev.find((c) => c.id === found);
            if (existing) return prev.map((c) => (c.id === found ? { ...c, qty: c.qty + 1 } : c));
            return [...prev, { id: prod.id, name: prod.name, emoji: prod.emoji, price: prod.price, qty: 1 }];
          });
          showToast(`Anoté ${prod.name}. Quedan ${avail} u. Total cuenta: ${formatCLP(cartTotalAfter)}`);
          setScanState("detected");
          setTimeout(() => setScanState("idle"), 900);
        }, 800);
      }

        setCart((prev) =>
          prev
            .map((c) => (c.id === id ? { ...c, qty: c.qty + delta } : c))
            .filter((c) => c.qty > 0)
        );

        const total = cart.reduce((s, c) => s + c.price * c.qty, 0);

          })
        );
        setSalesLog((prev) => [

        ]);

        setCart([]);

                          </div>
                          <div className="chart-col">
                            <div className="col-fill" style={{ height: "45%" }} />
                            <span style={{ fontSize: 10.5, fontWeight: 700 }}>15:00 - 18:00</span>
                          </div>
                          <div className="chart-col">
                            <div className="col-fill peak" style={{ height: "92%" }} />
                            <span style={{ fontSize: 10.5, fontWeight: 800, color: "#ff2440" }}>18:00 - 21:30 (Peak)</span>
                          </div>
                        </div>
                      </div>

                      <div style={{ background: "#fff9f0", border: "1px solid #fed7aa", borderRadius: 16, padding: 14 }}>
                        <h4 style={{ fontSize: 13, fontWeight: 800, color: "#9a4c06", marginBottom: 4 }}>
                          💡 Consejo de Alma para abrir mañana
                        </h4>
                        <p style={{ fontSize: 12.5, color: "#7c3803", lineHeight: 1.45 }}>
                          Hoy la hallulla se agotó antes de las 19:30. Para mañana pide <strong>10 kg extra de pan</strong> y separa <strong>{formatCLP(totalHoy * 0.35)}</strong> para cubrir las facturas de proveedores.
                        </p>
                      </div>

                      <div style={{ display: "flex", gap: 10, marginTop: 4 }}>
                        <button
                          style={{ flex: 1, background: "#141210", color: "white", border: "none", borderRadius: 12, padding: 14, fontWeight: 800, fontSize: 14, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}
                          onClick={executeCloseDay}
                        >
                          <CheckCircle2 size={18} color="#22c55e" /> Confirmar Cierre y Reiniciar Caja Diaria
                        </button>
                        <button
                          style={{ background: "var(--paper)", border: "none", borderRadius: 12, padding: "14px 20px", fontWeight: 700, fontSize: 13, cursor: "pointer" }}
                          onClick={() => setShowCloseDayModal(false)}
                        >
                          Cancelar
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {toast && (
                <div className="toast-landscape">
                  <Check size={16} color="#22c55e" />
                  <span>{toast}</span>
                </div>
              )}
            </main>
          </div>
        </div>
      );
    }

    const root = createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
